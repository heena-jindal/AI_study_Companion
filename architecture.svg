<svg width="800" height="330" viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="800" height="330" fill="#ffffff"/>

<!-- User -->
<rect x="300" y="15" width="200" height="46" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="400" y="43" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">User / API Client</text>

<line x1="400" y1="61" x2="400" y2="92" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Flask API -->
<rect x="290" y="96" width="220" height="46" rx="8" fill="#1f2937" stroke="#111827" stroke-width="1"/>
<text x="400" y="124" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Flask API (app.py)</text>

<!-- fan lines to 5 services -->
<line x1="330" y1="142" x2="96"  y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="365" y1="142" x2="248" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="142" x2="400" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="435" y1="142" x2="552" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="142" x2="704" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- 5 service boxes -->
<g>
<rect x="26" y="186" width="140" height="66" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
<text x="96" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">LLM Service</text>
<text x="96" y="230" text-anchor="middle" font-size="11" fill="#4338ca">explain + quiz gen</text>
<text x="96" y="245" text-anchor="middle" font-size="10" fill="#6366f1">(Groq, strict JSON)</text>
</g>

<g>
<rect x="178" y="186" width="140" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
<text x="248" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">RAG Service</text>
<text x="248" y="230" text-anchor="middle" font-size="11" fill="#047857">chunk + embed + retrieve</text>
<text x="248" y="245" text-anchor="middle" font-size="10" fill="#10b981">(ChromaDB, local embeds)</text>
</g>

<g>
<rect x="330" y="186" width="140" height="66" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
<text x="400" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Tracking</text>
<text x="400" y="230" text-anchor="middle" font-size="11" fill="#9a3412">quiz attempt history</text>
<text x="400" y="245" text-anchor="middle" font-size="10" fill="#f97316">(SQLite)</text>
</g>

<g>
<rect x="482" y="186" width="140" height="66" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="1"/>
<text x="552" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">Agent</text>
<text x="552" y="230" text-anchor="middle" font-size="11" fill="#9d174d">ReAct tool-calling loop</text>
<text x="552" y="245" text-anchor="middle" font-size="10" fill="#ec4899">(LangGraph)</text>
</g>

<g>
<rect x="634" y="186" width="140" height="66" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
<text x="704" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e">Evaluation</text>
<text x="704" y="230" text-anchor="middle" font-size="11" fill="#0369a1">faithfulness check</text>
<text x="704" y="245" text-anchor="middle" font-size="10" fill="#0ea5e9">(LLM-as-judge)</text>
</g>

<text x="400" y="300" text-anchor="middle" font-size="12" fill="#6b7280">All five modules are called directly, or chosen automatically by the Agent via /agent</text>
</svg>
